name: Docker

on:
  push:
    # Publish `master` as Docker `edge` image.
    branches:
      - main

    # Publish `v1.2.3` tags as releases.
    tags:
      - v*

  # Run tests for any PRs.
  pull_request:

  schedule:
    - cron: '35 0 * * 6'

env:
  IMAGE_NAME: mindflayervtt/server
  IMAGE_TITLE: Mind Flayer WebSocket Server
  IMAGE_DESCRIPTION: WebSocket Server for Mind Flayer Foundry VTT module

jobs:
  # Run tests.
  # See also https://docs.docker.com/docker-hub/builds/automated-testing/
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build container
        run: |
          if [ -f docker-compose.test.yml ]; then
            docker compose --file docker-compose.test.yml build
            docker compose --file docker-compose.test.yml run sut
          else
            docker build --tag mindflayer-server:test . --file Dockerfile
            bash .github/scripts/container-smoke.sh
          fi

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create semantic release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # Build images.
  build:
    runs-on: ubuntu-latest

    needs: [test, release]
    if: always() && needs.test.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Use released package metadata
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git fetch origin main
        git checkout --detach origin/main

    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: all

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Prepare
      id: prep
      run: |
        DOCKER_IMAGE=$IMAGE_NAME
        RELEASE_VERSION='${{ needs.release.outputs.version }}'
        if [[ "${{ github.ref }}" == refs/pull/* ]]; then
          VERSION_FULL="pr-${{ github.event.number }}"
          TAGS="${DOCKER_IMAGE}:${VERSION_FULL}"
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION_FULL="${{ github.ref_name }}"
          VERSION_FULL="${VERSION_FULL#v}"
          VERSION_MINOR="${VERSION_FULL%.*}"
          VERSION_MAJOR="${VERSION_MINOR%.*}"
          TAGS="${DOCKER_IMAGE}:${VERSION_FULL},${DOCKER_IMAGE}:${VERSION_MINOR},${DOCKER_IMAGE}:${VERSION_MAJOR},${DOCKER_IMAGE}:latest"
        else
          VERSION_FULL="${RELEASE_VERSION:-$(node -p "require('./package.json').version")}"
          TAGS="${DOCKER_IMAGE}:edge"
          if [[ -n "$RELEASE_VERSION" ]]; then
            VERSION_MINOR="${RELEASE_VERSION%.*}"
            VERSION_MAJOR="${VERSION_MINOR%.*}"
            TAGS="$TAGS,${DOCKER_IMAGE}:${RELEASE_VERSION},${DOCKER_IMAGE}:${VERSION_MINOR},${DOCKER_IMAGE}:${VERSION_MAJOR},${DOCKER_IMAGE}:latest"
          fi
        fi

        echo "version=${VERSION_FULL}" >> "$GITHUB_OUTPUT"
        echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
        echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        platforms: linux/amd64,linux/arm64,linux/s390x
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.prep.outputs.tags }}
        labels: |
          org.opencontainers.image.title=$IMAGE_TITLE
          org.opencontainers.image.description=$IMAGE_DESCRIPTION
          org.opencontainers.image.vendor=${{ github.repository_owner }}
          org.opencontainers.image.url=${{ github.event.repository.html_url }}
          org.opencontainers.image.source=${{ github.event.repository.html_url }}
          org.opencontainers.image.created=${{ steps.prep.outputs.created }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ steps.prep.outputs.version }}
